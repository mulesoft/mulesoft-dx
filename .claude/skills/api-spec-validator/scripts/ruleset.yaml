#%Validation Profile 1.0
profile: machaval
description: >
  Default description for generated profile. Update this content with the
  desired documentation text. 
violation:
  - api-info-description
  - api-title-ends-with-api
  - api-version-semver
  - input-types-described
  #- no-naked-strings
  - oas-only
  - operation-description
  - operation-examples
  - operation-id-camel-case
  - output-response-description
  - output-types-described
  - request-body-description
  - path-environment-identifier
  - path-organization-identifier
  #- schema-property-description
  #- schema-required-block
warning:
  - uri-parameter-x-origin
  - operation-id-max-length
  - operation-id-no-path-repetition
  - operation-summary-max-length
  - operation-summary-required
  - operation-summary-imperative-mood
  - operation-summary-no-trailing-period
validations:
  path-environment-identifier:
    message: |
      Path parameter must be named 'environmentId' (not '{{core.name}}').
    documentation: >
      In path parameters, use the name `environmentId` for the environment
      context. Do not use `envId` or `environment`.
    targetClass: apiContract.Parameter
    or:
      - not:
          propertyConstraints:
            apiContract.binding:
              pattern: path
      - not:
          propertyConstraints:
            core.name:
              in:
                - envId
                - environment
  path-organization-identifier:
    message: |
      Path parameter must be named 'organizationId' (not '{{core.name}}').
    documentation: >
      In path parameters, use the name `organizationId` for the organization
      context. Do not use `orgId` or `organization`.
    targetClass: apiContract.Parameter
    or:
      - not:
          propertyConstraints:
            apiContract.binding:
              pattern: path
      - not:
          propertyConstraints:
            core.name:
              in:
                - orgId
                - organization
  api-info-description:
    message: API info must have a non-empty description explaining the API's domain and purpose.
    documentation: >
      The info.description is the first signal an AI agent uses for API-level
      discovery. When choosing among many APIs, this description determines
      whether the agent selects the right one. It must clearly explain the
      API's domain, capabilities, and intended use cases.
    targetClass: apiContract.WebAPI
    propertyConstraints:
      core.description:
        minCount: 1
  api-title-ends-with-api:
    message: >
      API info.title '{{core.name}}' must end with 'API'.
      Rename to a clear, descriptive title ending with 'API'
      (e.g. 'Secrets Manager API', 'Object Store API').
    documentation: >
      All API specification titles (info.title) must end with the word 'API'
      to ensure consistent naming across the developer portal and documentation.
      Use a descriptive name that conveys the API's domain followed by 'API'.
      Avoid suffixes like 'Service', 'Reference', 'xAPI', or version numbers.
    targetClass: apiContract.WebAPI
    propertyConstraints:
      core.name:
        pattern: "API$"
  api-version-semver:
    message: >
      API info.version '{{core.version}}' must use semantic versioning (x.x.x).
      Use the format MAJOR.MINOR.PATCH (e.g. 1.0.0, 2.1.3). Do not prefix with
      'v' or 'V', and always include all three components.
    documentation: >
      The info.version field must follow Semantic Versioning (semver) with exactly
      three numeric components: MAJOR.MINOR.PATCH (e.g. 1.0.0, 2.1.3, 0.7.0).
      This ensures consistency across all API specifications and enables reliable
      version comparison and sorting. Avoid formats like 'v1', 'V1', '1.0',
      '1', or 'v1.0.0'.
    targetClass: apiContract.WebAPI
    propertyConstraints:
      core.version:
        minCount: 1
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  input-types-described:
    message: Parameter '{{core.name}}' must have a description.
    documentation: >
      All endpoint input parameters (query, path, header) must be documented
      with a description.
    targetClass: apiContract.Parameter
    propertyConstraints:
      core.description:
        minCount: 1
  no-naked-strings:
    message: >
      Scalar type '{{shacl.name}}' must have an enum or format; avoid naked
      strings with no constraints.
    documentation: >
      If a field has a limited set of options, it must use an enum. Avoid
      unconstrained string types

      (naked strings) so that APIs and AI consumers have explicit allowed values.
    targetClass: shapes.ScalarShape
    if:
      propertyConstraints:
        shacl.datatype:
          in:
            - http://www.w3.org/2001/XMLSchema#string
    then:
      or:
        - propertyConstraints:
            shacl.in:
              minCount: 1
        - propertyConstraints:
            shapes.format:
              minCount: 1
        - propertyConstraints:
            shacl.pattern:
              minCount: 1
  oas-only:
    message: API specification must be OpenAPI (OAS) 3.0 or 3.1, not RAML or OAS 2.0.
    documentation: >
      This rule ensures the API specification is written in OpenAPI
      Specification (OAS) format version 3.0 or later.

      RAML and OAS 2.0 specifications are not allowed. Only OAS 3.0 and OAS 3.1 are accepted.
    targetClass: doc.APIContractProcessingData
    propertyConstraints:
      doc.sourceSpec:
        in:
          - OAS 3.0
          - OAS 3.1
  operation-description:
    message: Operation '{{apiContract.method}}' must have a description.
    documentation: >
      Every endpoint operation must include a description to document its
      purpose and behavior.
    targetClass: apiContract.Operation
    propertyConstraints:
      core.description:
        minCount: 1
  operation-examples:
    message: Operation '{{apiContract.method}}' must have at least one response with
      an example.
    documentation: >
      Every endpoint must provide at least one example (in a response) so
      consumers can understand the response shape.
    targetClass: apiContract.Operation
    propertyConstraints:
      apiContract.returns:
        atLeast:
          count: 1
          validation:
            propertyConstraints:
              apiContract.payload / shapes.schema:
                nested:
                  propertyConstraints:
                    apiContract.examples:
                      minCount: 1
  operation-id-camel-case:
    message: >
      Operation '{{apiContract.method}}' must have an operationId in camelCase
      (e.g. calculateTaxRate, provisionCloudServer).

      Avoid snake_case (get_data) and generic single words (update).
    documentation: >
      Every endpoint operation must have an operationId. The value must be
      descriptive and in camelCase:

      preferred examples are calculateTaxRate, provisionCloudServer. Avoid snake_case like get_data

      and generic verbs like get_data or update.
    targetClass: apiContract.Operation
    propertyConstraints:
      apiContract.operationId:
        minCount: 1
        pattern: ^[a-z][a-z0-9]*[A-Z][a-zA-Z0-9]*$
    examples:
      valid: |
        paths:
          /tax:
            post:
              operationId: calculateTaxRate
              responses:
                '200':
                  description: OK
      invalid: |
        paths:
          /items:
            put:
              operationId: update
              responses:
                '200':
                  description: OK
  output-response-description:
    message: Response '{{apiContract.statusCode}}' must have a description.
    documentation: |
      Every endpoint response must include a description of the output.
    targetClass: apiContract.Response
    propertyConstraints:
      core.description:
        minCount: 1
  output-types-described:
    message: Response '{{apiContract.statusCode}}' must have a description.
    documentation: |
      Every endpoint response must include a description of the output.
    targetClass: apiContract.Response
    propertyConstraints:
      core.description:
        minCount: 1
  request-body-description:
    message: Request body must have a description when present.
    documentation: >
      When an operation has a request body, it must include a description of the
      input.
    targetClass: apiContract.Request
    if:
      propertyConstraints:
        apiContract.payload:
          minCount: 1
    then:
      propertyConstraints:
        core.description:
          minCount: 1
  schema-property-description:
    message: Schema property '{{shacl.name}}' must have a description.
    documentation: >
      All properties in response and request schemas must be documented with a
      description.
    targetClass: shacl.PropertyShape
    propertyConstraints:
      shapes.range / core.description:
        minCount: 1
  schema-required-block:
    message: >
      Object schema must explicitly list at least one required field (use the
      'required' array) to prevent optional parameters from being guessed.
    documentation: >
      Always explicitly list required fields in the schema. When an object has
      required properties,

      list them in the 'required' array so that API and AI consumers do not guess optional parameters.
    targetClass: shacl.NodeShape
    if:
      propertyConstraints:
        shacl.property:
          minCount: 1
    then:
      propertyConstraints:
        shacl.property:
          atLeast:
            count: 1
            validation:
              propertyConstraints:
                shacl.minCount:
                  minInclusive: 1
  uri-parameter-x-origin:
    message: >
      URI (path) parameter '{{core.name}}' must define the x-origin extension
      (e.g. dynamic enum source: api, operation, values).
    documentation: >
      OpenAPI `x-origin` on path parameters documents how allowed values are
      resolved (source API, operation, JSONPath for values/labels). Every path
      parameter must include it.
    targetClass: apiContract.Parameter
    or:
      - not:
          propertyConstraints:
            apiContract.binding:
              pattern: path
      - propertyConstraints:
          apiExt.origin:
            minCount: 1
  operation-id-max-length:
    message: >
      Operation '{{apiContract.method}}' has an overly long operationId.
      Keep operationIds at 40 characters or fewer for readability
      (verb + primary noun; e.g. getGatewayRuntimeConfig).
    documentation: >
      Long operationIds — especially those that mirror deep path structures —
      hurt developer autocomplete and AI-agent tool discovery. Prefer short,
      action-oriented names that describe what the operation does, not where
      it lives in the URI tree. Keep them at 40 characters or fewer.
    targetClass: apiContract.Operation
    propertyConstraints:
      apiContract.operationId:
        minCount: 1
        pattern: "^.{1,40}$"
    examples:
      valid: |
        paths:
          /organizations/{organizationId}/environments/{environmentId}/gateways/{gatewayId}/runtime-config:
            get:
              operationId: getGatewayRuntimeConfig
              responses:
                '200':
                  description: OK
      invalid: |
        paths:
          /organizations/{organizationId}/environments/{environmentId}/gateways/{gatewayId}/runtime-config:
            get:
              operationId: getOrganizationsByOrganizationidEnvironmentsByEnvironmentidGatewaysByGatewayidRuntimeConfiguration
              responses:
                '200':
                  description: OK
  operation-id-no-path-repetition:
    message: >
      Operation '{{apiContract.method}}' has an operationId that mirrors
      the URI path with two or more 'By<Segment>id' suffixes. Prefer a
      short, action-oriented name that describes intent, not path structure.
    documentation: >
      Path-derived operationIds like
      getOrganizationsByOrganizationidEnvironmentsByEnvironmentidGatewaysByGatewayid
      duplicate structure that already lives in the path template and are
      unreadable in tool listings. Use a name that describes what the
      operation does (verb + primary noun). A single 'ById' suffix
      (e.g. getUserById) is fine — this rule only fires when two or more
      such suffixes stack.
    targetClass: apiContract.Operation
    not:
      propertyConstraints:
        apiContract.operationId:
          pattern: "By[A-Z][a-zA-Z0-9]*[Ii]d.*By[A-Z][a-zA-Z0-9]*[Ii]d"
    examples:
      valid: |
        paths:
          /users/{userId}:
            get:
              operationId: getUserById
              responses:
                '200':
                  description: OK
      invalid: |
        paths:
          /organizations/{organizationId}/environments/{environmentId}/gateways/{gatewayId}:
            get:
              operationId: getOrganizationsByOrganizationidEnvironmentsByEnvironmentidGatewaysByGatewayid
              responses:
                '200':
                  description: OK
  operation-summary-max-length:
    message: >
      Operation '{{apiContract.method}}' has a summary longer than 60 characters.
      Keep summaries short so they render cleanly in developer portal sidebars
      and operation headers. Move longer prose to the operation description.
    documentation: >
      The `summary` is the human-readable title shown in list views, navigation
      sidebars, and operation detail headers. Long summaries wrap awkwardly,
      truncate in narrow columns, and are harder to scan. Aim for a short verb
      + primary noun (e.g. "Create messaging client"). If the operation needs
      more context, put it in `description`, which supports full prose.
    targetClass: apiContract.Operation
    or:
      - not:
          propertyConstraints:
            apiContract.guiSummary:
              minCount: 1
      - propertyConstraints:
          apiContract.guiSummary:
            pattern: "^.{1,60}$"
    examples:
      valid: |
        paths:
          /clients:
            get:
              summary: List messaging clients
              operationId: listClients
              responses:
                '200':
                  description: OK
      invalid: |
        paths:
          /clients:
            get:
              summary: List every single messaging client that is currently registered in this environment
              operationId: listClients
              responses:
                '200':
                  description: OK
  operation-summary-required:
    message: >
      Operation '{{apiContract.method}}' is missing a `summary`. Without it,
      developer portals fall back to the operationId as a title, which is
      unreadable for humans.
    documentation: >
      Every operation should define a short human-readable `summary` — used as
      the operation title in developer portals, navigation lists, and generated
      docs. Prefer imperative voice (e.g. "Create messaging client"). When
      summary is missing, portals typically render the operationId as a
      camelCase-split string, which is often awkward and inconsistent.
    targetClass: apiContract.Operation
    propertyConstraints:
      apiContract.guiSummary:
        minCount: 1
    examples:
      valid: |
        paths:
          /clients:
            get:
              summary: List messaging clients
              operationId: listClients
              responses:
                '200':
                  description: OK
      invalid: |
        paths:
          /clients:
            get:
              operationId: listClients
              responses:
                '200':
                  description: OK
  operation-summary-imperative-mood:
    message: >
      Operation '{{apiContract.method}}' summary should start with an imperative
      verb (e.g. "Create", "List", "Update"), not indicative third-person
      singular (e.g. "Creates", "Lists", "Updates").
    documentation: >
      Summaries read as action titles in the portal — imperative voice is
      shorter, more scannable, and consistent with common API docs conventions
      (Stripe, GitHub, Twilio). Prefer "Create messaging client" over
      "Creates a messaging client". This rule rejects any first word that ends
      in a consonant + "s" (the typical third-person indicative shape). Words
      that end in "-ss" (e.g. "Access", "Process") are allowed. The rule does
      not enforce that the first word be a known verb — any imperative-shaped
      first word passes.
    targetClass: apiContract.Operation
    or:
      - not:
          propertyConstraints:
            apiContract.guiSummary:
              minCount: 1
      - propertyConstraints:
          apiContract.guiSummary:
            pattern: "^[A-Z][a-z]*([^s]|ss)(\\s|$)"
    examples:
      valid: |
        paths:
          /clients:
            get:
              summary: List messaging clients
              operationId: listClients
      invalid: |
        paths:
          /clients:
            get:
              summary: Lists the messaging clients
              operationId: listClients
  operation-summary-no-trailing-period:
    message: >
      Operation '{{apiContract.method}}' summary ends with a period. Summaries
      are titles, not sentences — drop the trailing punctuation.
    documentation: >
      Summaries render as short titles in the portal sidebar and operation
      headers. Trailing periods look out of place in a heading context and are
      inconsistent with the rest of the catalog. Keep prose (with periods) in
      `description`.
    targetClass: apiContract.Operation
    or:
      - not:
          propertyConstraints:
            apiContract.guiSummary:
              minCount: 1
      - not:
          propertyConstraints:
            apiContract.guiSummary:
              pattern: "\\.$"
    examples:
      valid: |
        paths:
          /clients:
            get:
              summary: List messaging clients
              operationId: listClients
      invalid: |
        paths:
          /clients:
            get:
              summary: List messaging clients.
              operationId: listClients
