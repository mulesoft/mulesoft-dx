openapi: 3.0.0
info:
  title: API Designer Experience API
  description: Design and manage API specifications and fragments in Design Center. Create projects, manage branches, modify files, and publish to Exchange.
  version: 1.0.0
servers:
- url: https://anypoint.mulesoft.com/designcenter/api-designer
  description: US
- url: https://eu1.anypoint.mulesoft.com/designcenter/api-designer
  description: EU
security:
- bearerAuth: []
- clientAuth: []
paths:
  /ping:
    get:
      description: to check if service is up
      responses:
        '200':
          description: Successful operation.
      summary: Check service health
      operationId: getPing
  /status:
    get:
      description: to check if service is up
      responses:
        '200':
          description: Successful operation.
      summary: Get service status
      operationId: getStatus
  /health:
    get:
      description: to check if service is up
      responses:
        '200':
          description: Successful operation.
      summary: Get service health status
      operationId: getHealth
  /ready:
    get:
      description: Readiness check, reports status of dependent services (e.g. redis)
      responses:
        '200':
          description: Successful operation.
      summary: Check service readiness
      operationId: getReady
  /config:
    get:
      description: Returns client configuration such as currentDate, expirationTime, muleOrganizationId, retryTimes, retryTimeout and feature flags
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {}
        '401':
          description: Authorization failed
      summary: Get client configuration
      operationId: getConfig
  /features:
    post:
      description: Resolves a set of feature flags by name for the current user
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example:
              - design-center-pkce-ready
              - api-designer-ui-pkce-ready
        x-amf-mediaType: application/json
        description: The names of the feature flags to resolve.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
              example:
                design-center-pkce-ready: true
                api-designer-ui-pkce-ready: false
        '401':
          description: Authorization failed
      summary: Resolve feature flags
      operationId: resolveFeatures
  /organizations:
    get:
      description: Retrieves the organizations the current user is a member of
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '401':
          description: Authorization failed
      summary: List organizations the user belongs to
      operationId: listOrganizations
  /organizations/{organizationId}/settings:
    get:
      description: Retrieves settings for organization
      parameters:
      - name: organizationId
        description: The organizationId to identify the target resource.
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      - name: x-all-settings
        description: When true, retrieves both the default branch setting and the Github integration setting, nested under defaultBranchSetting/githubIntegrationSetting. When absent or false, retrieves only the default branch setting as a flat object.
        in: header
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '401':
          description: Authorization failed
      summary: Get organization settings
      operationId: getOrganizationSettings
    post:
      description: Changes settings for organization
      parameters:
      - name: organizationId
        description: The organizationId to identify the target resource.
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      - name: x-all-settings
        description: When true, the request body must use branchName/githubIntegration (either or both) and the response is nested under defaultBranchSetting/githubIntegrationSetting. When absent or false, only the default branch setting can be changed, using branchName in the request body.
        in: header
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettings'
        x-amf-mediaType: application/json
        description: The settings data to update.
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '401':
          description: Authorization failed
      summary: Update organization settings
      operationId: updateOrganizationSettings
  /organizations/{organizationId}/access/permissions:
    get:
      description: Retrieves admin permissions
      parameters:
      - name: organizationId
        description: The organizationId to identify the target resource.
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPermissions'
        '401':
          description: Authorization failed
      summary: Get organization admin permissions
      operationId: getOrganizationPermissions
  /organizations/{organizationId}/exchange/facets:
    get:
      description: Retrieves Exchange facets for the given organization
      parameters:
      - name: organizationId
        description: The organizationId to identify the target resource.
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeFacets'
        '401':
          description: Authorization failed
      summary: Get organization Exchange facets
      operationId: getOrganizationExchangeFacets
  /organizations/{organizationId}/identities:
    get:
      description: Retrieves identities (users/teams) belonging to the given organization, optionally filtered by search term
      parameters:
      - name: organizationId
        description: The organizationId to identify the target resource.
        required: true
        in: path
        schema:
          type: string
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      - name: search
        description: Search term to filter identities by
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '401':
          description: Authorization failed
      summary: List organization identities
      operationId: listOrganizationIdentities
  /documentation:
    get:
      description: Retrieves documentation content for the given language
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      - name: language
        description: Language of the documentation to retrieve. Although the query parameter itself is optional, omitting it results in a 400 response
        in: query
        schema:
          enum:
          - RAML1.0
          - RAML0.8
          type: string
      responses:
        '200':
          description: Successful operation.
        '400':
          description: '"Invalid language {language}" if language is provided but not supported, or "Required parameter language not provided" if language is omitted'
        '401':
          description: Authorization failed
        '404':
          description: No documentation URL was provided
      summary: Get documentation content
      operationId: getDocumentation
  /projects:
    post:
      description: Creates a new project
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        x-amf-mediaType: application/json
        description: The projects data to create.
      responses:
        '201':
          description: Resource created successfully.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                organizationId: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                id: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                name: string
                description: string
                type: string
                createdBy: string
                createdDate: 0
        '401':
          description: Authorization failed
        '409':
          description: Project {type}-{name} already exists
      summary: Create project
      operationId: createProject
    get:
      description: Gets all the projects that the user has access
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
              - id: string
                type: string
        '401':
          description: Authorization failed
      summary: List projects the user can access
      operationId: listProjects
  /projects/credentials:
    get:
      description: Retrieve VCS credentials associated to the given user. Used for Github sync
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '401':
          description: Authorization failed
      summary: Get VCS credentials for Github sync
      operationId: getProjectCredentials
    delete:
      description: Delete VCS credentials associated to the given user. Used for Github sync
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '204':
          description: Operation completed successfully with no content returned.
        '401':
          description: Authorization failed
      summary: Delete VCS credentials for Github sync
      operationId: deleteProjectCredentials
  /projects/import:
    post:
      description: Creates a project from a zip file containing files
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectImport'
        x-amf-mediaType: application/json
        description: The import data to create.
      responses:
        '201':
          description: Resource created successfully.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                organizationId: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                id: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                name: string
                description: string
                type: string
                createdBy: string
                createdDate: 0
        '400':
          description: Bad Request
        '401':
          description: Authorization failed
        '409':
          description: Project {type}-{name} already exists
      summary: Import project from zip file
      operationId: importProject
  /projects/access/permissions:
    get:
      description: Gets design center general permissions. eg Create projects
      parameters:
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralPermissions'
        '401':
          description: Authorization failed
      summary: Get Design Center general permissions
      operationId: getDesignCenterPermissions
  /projects/{projectId}:
    get:
      description: Get project data
      parameters:
      - $ref: '#/components/parameters/XOrigin_projectId_Path'
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                organizationId: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                id: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                name: string
                description: string
                type: string
                createdBy: string
                createdDate: 0
        '401':
          description: Authorization failed
      summary: Get project by ID
      operationId: getProjectById
    patch:
      description: 'Patches project metadata.

        CreatedBy is only editable by the Project Owner or Organization Admins

        '
      parameters:
      - $ref: '#/components/parameters/XOrigin_projectId_Path'
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: x-organization-id
        description: "OrganizationId, which identifies the organization to which perform the operation. \nThis can be found in the organizations page by the organization administrator.\n"
        required: true
        in: header
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      - name: authorization
        description: Bearer Access Token
        required: true
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
        x-amf-mediaType: application/json
        description: The projects data to update.
      responses:
        '200':
          description: Successful operation.
          x-amf-mediaType: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                organizationId: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                id: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
                name: string
                description: string
                type: string
                createdBy: string
                createdDate: 0
        '401':
          description: Authorization failed
      summary: Patch project metadata
      operationId: patchProject
    delete:
      description: Deletes the given project
      parameters:
      - $ref: '#/components/parameters/XOrigin_projectId_Path'
      - name: x-owner-id
        description: "User's ownerId, which identifies the user performing the operation. \nThis is NOT the username, but an UUID that can be found in the users page by the organization administrator.\n"
        required: true
