components:
  securitySchemes:
    bearerAuth:
      $ref: ../../fragments/anypoint_fragment.yaml#/components/securitySchemes/bearerAuth
    clientAuth:
      $ref: ../../fragments/anypoint_fragment.yaml#/components/securitySchemes/clientAuth
  schemas:
    ProjectCreate:
      example:
        name: ProjectName
        description: Project Description
        classifier: raml
        format: yaml
        version: '1.0'
      type: object
      required:
      - name
      - classifier
      - format
      - version
      properties:
        name:
          description: Project name. Required, max 100 characters
          type: string
          maxLength: 100
        description:
          type: string
        classifier:
          description: Type of asset this project represents. Required
          enum:
          - raml
          - raml-fragment
          - oas
          - oas-components
          - evented-api
          - json-schema
          type: string
        subType:
          description: Fragment subtype (e.g. library, trait, resourceType). Required when classifier is a fragment classifier (raml-fragment, oas-components), forbidden otherwise
          type: string
        format:
          description: 'File format for the project. Allowed values depend on classifier: raml -> yaml; oas / evented-api -> yaml or json; json-schema -> json'
          enum:
          - yaml
          - json
          type: string
        version:
          description: 'Spec version for the project. Allowed values depend on classifier: raml (non-fragment) -> 1.0, 0.8; raml-fragment -> 1.0; oas (non-fragment) -> 2.0, 3.0; oas-components -> 3.0; evented-api -> 2.0, 2.6; json-schema -> draft-07, draft/2019-09, draft-04, draft-03'
          type: string
        visualDesignerMode:
          description: Whether the project is created in Visual Designer mode. Not allowed when classifier is a fragment classifier
          type: boolean
        vcsStorageType:
          description: Storage backend for the project. Defaults to GIT_INTERNAL when omitted
          enum:
          - GIT_EXTERNAL
          - GIT_INTERNAL
          type: string
        externalUri:
          description: URI of the external git repository. Required when vcsStorageType is GIT_EXTERNAL
          type: string
        externalUriSchema:
          description: Schema of the external URI (e.g. FILE, HTTPS). Required when vcsStorageType is GIT_EXTERNAL
          type: string
        externalOrgName:
          description: Name of the external git organization/owner hosting the repository
          type: string
        externalOrgType:
          description: Type of the external git organization (e.g. USER, ORGANIZATION)
          type: string
        clone:
          description: Whether this creation request is cloning an existing project
          type: boolean
    Project:
      example:
        id: a1048809-64eb-4830-9974-9dc673b92013
        organizationId: f397ce0e-ba9b-40fb-a96c-8bbc1d494b40
        name: Spec Name
        type: raml
        createdBy: 54bf6b94-d209-44fa-b13a-cb6991ec6fb8
        description: Project description
        vcsStorageType: GIT_INTERNAL
        createdDate: 1702669593404
        lastUpdatedDate: 1702669593404
        defaultBranch: master
        deleted: false
      type: object
      required:
      - organizationId
      - id
      - name
      - description
      - type
      - createdBy
      - createdDate
      - lastUpdatedDate
      - defaultBranch
      - deleted
      - vcsStorageType
      properties:
        organizationId:
          description: Organization ID to which the project corresponds
          example: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        id:
          description: Unique ID that identifies the project
          example: 6a2f41a3-c54c-fce8-32d2-0324e1c32e22
          type: string
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        name:
          description: Project name
          type: string
        description:
          description: Project description
          type: string
        type:
          description: Project type
          type: string
        externalUri:
          description: URI of the external git repository
          type: string
        createdBy:
          description: Name of the user that created the project
          type: string
        createdDate:
          description: Creation date of the project
          type: integer
          format: long
        lastUpdatedDate:
          description: Last update date of the project
          type: integer
          format: long
        defaultBranch:
          description: Name of the default branch of the project
          type: string
        deleted:
          description: Whether the project has been deleted
          type: boolean
        vcsStorageType:
          description: Storage backend for the project
          enum:
          - GIT_EXTERNAL
          - GIT_INTERNAL
          type: string
        initialWorkingDirectory:
          description: Initial working directory metadata for the project
          type: object
          properties:
            id:
              type: string
            projectId:
              type: string
            branch:
              type: string
            ownerId:
              type: string
            ownerUsername:
              type: string
            ownerEmail:
              type: string
            vcsType:
              type: string
            vcsStorageType:
              enum:
              - GIT_EXTERNAL
              - GIT_INTERNAL
              type: string
            externalUriSchema:
              type: string
            createdDate:
              type: integer
              format: long
            deleted:
              type: boolean
    ProjectImport:
      description: 'Multipart/form-data request. Accepts the same classifier/format/version fields as project creation (see ProjectCreate), plus the fields below'
      example:
        name: ProjectName
        description: Project Description
        type: raml
        mainFile: api.raml
        zipFile: ZipFile attachment
        dependencies: '[{"groupId":"com.mulesoft","assetId":"fragmentdatatype","version":"1.0.0"}]'
      type: object
      required:
      - name
      - zipFile
      properties:
        name:
          type: string
        description:
          type: string
        classifier:
          description: Type of asset this project represents. Falls back to the deprecated `type` field when omitted
          enum:
          - raml
          - raml-fragment
          - oas
          - oas-components
          - evented-api
          - json-schema
          type: string
        type:
          description: Deprecated alias for classifier, kept for backwards compatibility
          enum:
          - raml
          - raml-fragment
          - oas
          - oas-components
          - evented-api
          - json-schema
          type: string
        subType:
          description: Fragment subtype. Required when classifier is a fragment classifier (raml-fragment, oas-components), forbidden otherwise
          type: string
        format:
          description: File format. Defaults based on classifier when omitted
          enum:
          - yaml
          - json
          type: string
        version:
          description: Spec version for the project. Defaults based on classifier when omitted
          type: string
        mainFile:
          description: Path, within the zip file, of the project's main/entry file
          type: string
        zipFile:
          description: Zip file (application/zip or application/x-zip-compressed) containing the project's files
          type: string
          format: binary
        dependencies:
          description: 'JSON-stringified array of dependencies, e.g. [{"groupId":"gid","assetId":"aid","version":"1.0.0"}]'
          type: string
    ProjectPatch:
      type: object
      required:
      - createdBy
      properties:
        createdBy:
          description: New Project owner id
          example: edc150a4-8365-4b1a-adfa-0dc1dc63227b
          type: string
    Branch:
      type: object
      required:
      - name
      - commitId
      properties:
        name:
          description: Name of the branch
          example: master
          type: string
        commitId:
          description: Commit ID
          example: 734713bc0
          type: string
    RenameBranch:
      description: Rename branch payload
      type: object
      required:
      - branchName
      properties:
        branchName:
          description: Name of the new branch name
          type: string
    Commit:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        authorName:
          type: string
        authorEmail:
          type: string
        committerName:
          type: string
        committerEmail:
          type: string
        dateCreated:
          type: number
    BranchMerge:
      type: object
      required:
      - sourceBranch
      properties:
        sourceBranch:
          type: string
        squashCommits:
          type: boolean
          default: false
        commitMessage:
          type: string
        conflictsResolutionStrategy:
          enum:
          - OURS
          - THEIRS
          - NONE
          type: string
    Files:
      example: *id001
      type: array
      items:
        $ref: '#/components/schemas/items'
    FileContents:
      example:
      - path: /folder/text.txt
        content: Content of the file
      - path: /folder/text2.txt
        content: Content of the file2
      type: array
      items:
        $ref: '#/components/schemas/items_1'
    FilesForm:
      example:
        fileExample.txt: Content of fileExample file in text/plain
        file.json: "{\n    \"type\": \"FOLDER\",\n    \"path\": \"/folder\"\n}\n"
      type: object
      additionalProperties:
        description: File to save, where the property name is the file path
        type: string
        x-amf-fileTypes:
        - '*/*'
        format: binary
    FilePath:
      example:
        type: FOLDER
        path: /folder
      type: object
      required:
      - path
      properties:
        path:
          type: string
        type:
          default: FILE
          enum:
          - FOLDER
          - FILE
          type: string
    Lock:
      description: Project lock enables editing mode for the user that locks the project, and readonly mode for all other users.
      type: object
      required:
      - locked
      properties:
        locked:
          description: True when the user has the lock, otherwise false.
          example: true
          type: boolean
        name:
          description: Name of the user
          example: demo-username
          type: string
    ProjectPublish:
      type: object
      required:
      - groupId
      - assetId
      - version
      - classifier
      properties:
        groupId:
          description: Business group where the Exchange asset will be published
          example: 1da12ec1-7614-43a3-bf24-ff754cab8ddf
          type: string
        assetId:
          description: ID that will identify the asset in Exchange
          example: products-api
          type: string
        version:
          description: Version that will identify the asset in Exchange
          example: 1.0.0
          type: string
        name:
          description: The visible name of the asset. Default to the project name
          type: string
        classifier:
          description: Classifier of the asset
          enum:
          - raml
          - raml-fragment
          - oas
          - oas-components
          - evented-api
          - json-schema
          type: string
        description:
          description: The description of the asset being created
          type: string
        type:
          description: The type of the asset to be created, if none has been specified it will be inferred by the file's classifier
          example: rest-api
          type: string
        dependencies:
          description: 'A string of comma-separated dependencies. The dependencies field must respect the following convention: dependencies=GROUP_ID:ASSET_ID:VERSION,GROUP_ID:ASSET_ID:VERSION'
          example: 1da12ec1-7614-43a3-bf24-ff754cab8ddf:american-flights:1.0.0,org.mule.examples:salesforce-fragment:2.1.0
          type: string
        keywords:
          description: A string of comma-separated values that represents the values to be saved as asset's attributes. Used to facilitate to find the asset by these keywords in the search
          example: api,raml,auth,jwt,token
          type: string
    ExchangeAssetGAV:
      type: object
      required:
      - groupId
      - assetId
      - version
      properties:
        groupId:
          description: Exchange asset group ID that identifies the business group to which it belongs
          example: gid1234
          type: string
        assetId:
          description: Asset ID
          example: exchange-demo-asset
          type: string
        version:
          description: Asset version
          example: 1.0.0
          type: string
    ProjectSync:
      type: object
      required:
      - domain
      - domainType
      - repositoryName
      properties:
        domain:
          description: Domain value where the repo will be created
          type: string
        domainType:
          description: Domain type where the repo will be created, can be in a given user or organization
          enum:
          - USER
          - ORGANIZATION
          type: string
        repositoryName:
          description: Name of the repository to be created
          type: string
    ProjectPermissions:
      type: object
      required:
      - projectId
      - canModify
      - canDelete
      - canRename
      properties:
        projectId:
          type: string
        canModify:
          type: boolean
        canDelete:
          type: boolean
        canRename:
          type: boolean
        canPublish:
          type: boolean
        canShare:
          type: boolean
        canOwn:
          type: boolean
    SharedWith:
      description: At least one of sharedWith/revoked must be provided, with a combined maximum of 20 entries (configurable via MAX_CONCURRENT_PERMISSION_CHANGES)
      type: object
      properties:
        sharedWith:
          description: Identities to grant (or change) a role on the project
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              role:
                enum:
                - VIEWER
                - COMMENTER
                - EDITOR
                - ADMIN
                type: string
              type:
                enum:
                - user
                - team
                - organization
                type: string
        revoked:
          description: Identities to revoke all access from
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              role:
                enum:
                - VIEWER
                - COMMENTER
                - EDITOR
                - ADMIN
                type: string
              type:
                enum:
                - user
                - team
                - organization
                type: string
    SharedWithResult:
      type: object
      required:
      - sharedWith
      - revoked
      properties:
        sharedWith:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              role:
                enum:
                - VIEWER
                - COMMENTER
                - EDITOR
                - ADMIN
                type: string
              type:
                enum:
                - user
                - team
                - organization
                type: string
              result:
                enum:
                - ok
                - failed
                type: string
        revoked:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              role:
                enum:
                - VIEWER
                - COMMENTER
                - EDITOR
                - ADMIN
                type: string
              type:
                enum:
                - user
                - team
                - organization
                type: string
              result:
                enum:
                - ok
                - failed
                type: string
    SharedWithIdentities:
      type: object
      required:
      - sharedWith
      properties:
        sharedWith:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - username
            - role
            - type
            properties:
              id:
                type: string
              name:
                type: string
              email:
                type: string
              username:
                type: string
              role:
                type: string
              type:
                type: string
    EventPayload:
      type: object
      required:
      - id
      - payload
      properties:
        id:
          type: string
        payload:
          type: object
    OrgSettings:
      description: |-
        Org Settings payload. The shape of this object depends on the x-all-settings request header:
        - When x-all-settings is absent or false, only the default branch setting is read/written and the
          body/response is a flat object with branchName/defaultBranch and lastUpdatedDate/organizationId/updatedBy.
        - When x-all-settings is true, both the default branch setting and the Github integration setting are
          read/written together, nested under defaultBranchSetting and githubIntegrationSetting.
      type: object
      properties:
        branchName:
          description: Name of the default branch. Used in request bodies (and in the response when x-all-settings is not true)
          type: string
        defaultBranch:
          description: Name of the default branch, as returned in the response when x-all-settings is not true
          type: string
        githubIntegration:
          description: Whether Github integration is enabled for the organization. Used in request bodies when x-all-settings is true
          type: boolean
        defaultBranchSetting:
          description: Default branch setting, returned when x-all-settings is true
          type: object
          required:
          - defaultBranch
          properties:
            defaultBranch:
              type: string
            organizationId:
              type: string
            lastUpdatedDate:
              type: number
            updatedBy:
              type: string
        githubIntegrationSetting:
          description: Github integration setting, returned when x-all-settings is true
          type: object
          required:
          - githubIntegration
          properties:
            githubIntegration:
              type: boolean
            organizationId:
              type: string
            lastUpdatedDate:
              type: number
            updatedBy:
              type: string
            projectsUnsynced:
              type: array
              items:
                type: string
            projectsWithError:
              type: array
              items:
                type: string
        organizationId:
          type: string
        lastUpdatedDate:
          type: number
        updatedBy:
          type: string
    AdminPermissions:
      description: Organization-level admin permissions for the current user
      type: object
      required:
      - isAdmin
      properties:
        isAdmin:
          description: Whether the current user is an administrator of the organization
          type: boolean
    ExchangeFacets:
      description: Exchange facets metadata
      type: object
      required:
      - types
      - categories
      - organizations
      - tags
      - status
      - fields
      properties:
        types:
          description: Supported Exchange Asset types
          type: array
          items:
            type: string
        categories:
          description: Exchange Categories used in the given organization
          type: array
          items:
            type: object
        organizations:
          description: Organizations that have published Exchange assets visible to the current user
          type: array
          items:
            type: object
        tags:
          description: Exchange tags used in the given organization
          type: array
          items:
            type: string
        status:
          description: Exchange asset statuses used in the given organization
          type: array
          items:
            type: string
        fields:
          description: Additional searchable fields available for Exchange assets
          type: array
          items:
            type: object
    GeneralPermissions:
      description: Design Center general (org-level) permissions for the current user
      type: object
      required:
      - canCreate
      - canPublish
      - canAdministrate
      properties:
        canCreate:
          type: boolean
        canPublish:
          type: boolean
        canAdministrate:
          type: boolean
    ExternalRepository:
      type: object
      required:
      - name
      - owner
      - private
      - imported
      - description
      properties:
        name:
          type: string
        owner:
          type: object
          required:
          - name
          - type
          properties:
            name:
              type: string
            type:
              type: string
        private:
          type: boolean
        imported:
          type: boolean
        description:
          type: string
    ExternalOrganization:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
    items:
      example:
        type: FOLDER
        path: /folder
      type: object
      required:
      - path
      properties:
        path:
          type: string
        type:
          default: FILE
          enum:
          - FOLDER
          - FILE
          type: string
    items_1:
      type: object
      required:
      - path
      - content
      properties:
        path:
          type: string
        content:
          type: string
  parameters:
    XOrigin_projectId_Path:
      name: projectId
      description: Project unique ID
      required: true
      in: path
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
      x-origin:
      - api: urn:api:api-designer-experience
        operation: listProjects
        description: GET `/projects` in this API; use `[].id` values as `projectId`.
        values: $[*].id
        labels: $[*].name
