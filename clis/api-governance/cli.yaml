name: API Governance
slug: api-governance
version: "4.x"
short_description: "Use the `governance` commands to automate your API Governance processes."
parent_cli:
  name: Anypoint CLI
  slug: anypoint-cli
install:
  npm: "npm install -g anypoint-cli-v4"
  plugin: "anypoint-cli-v4 plugins:install anypoint-cli-governance-plugin"
docs:
  source: "scrape"
  base_url: "https://docs.mulesoft.com/anypoint-cli/latest/api-governance"
  file: docs/api-governance.md
tags:
  - cli
  - anypoint
snippets:
  - id: default-options
    title: "Default Flags"
    matches:
      - "#default-options"
    file: snippets/default-options.md
