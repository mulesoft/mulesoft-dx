name: Local Server Clusters
slug: server-clusters
version: "4.x"
short_description: "Use the `cluster` commands to automate your Local Server Clusters processes."
parent_cli:
  name: Anypoint CLI
  slug: anypoint-cli
install:
  npm: "npm install -g anypoint-cli-v4"
  plugin: "anypoint-cli-v4 plugins:install anypoint-cli-runtime-mgr-plugin"
docs:
  source: "scrape"
  base_url: "https://docs.mulesoft.com/anypoint-cli/latest/server-clusters"
  file: docs/server-clusters.md
tags:
  - cli
  - anypoint
  - Runtime Manager
snippets:
  - id: default-options
    title: "Default Flags"
    matches:
      - "#default-options"
    file: snippets/default-options.md
