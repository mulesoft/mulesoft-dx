name: Standalone Alerts
slug: standalone-alerts
version: "4.x"
short_description: "Use these commands to control alerts for apps that are deployed to your local Mule server and managed with Runtime Manager."
parent_cli:
  name: Anypoint CLI
  slug: anypoint-cli
install:
  npm: "npm install -g anypoint-cli-v4"
  plugin: "anypoint-cli-v4 plugins:install anypoint-cli-runtime-mgr-plugin"
docs:
  source: "scrape"
  base_url: "https://docs.mulesoft.com/anypoint-cli/latest/standalone-alerts"
  file: docs/standalone-alerts.md
tags:
  - cli
  - anypoint
  - Runtime Manager
snippets:
  - id: default-options
    title: "Default Flags"
    matches:
      - "#default-options"
    file: snippets/default-options.md
