capabilities:
  tools: { listChanged: false }

tools:
  - name: createAsset
    title: Create Asset
    description: |
      Creates a new asset in Anypoint Exchange.
      For the simplest case (custom asset), only `name` is required.
      The asset type determines which additional properties are needed.
    inputSchema:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
          description: The ID of the organization where the asset will be created
        groupId:
          type: string
          description: Group ID of the asset (usually same as organizationId)
        assetId:
          type: string
          description: Unique identifier for the asset within the group
        version:
          type: string
          description: Semantic version of the asset (e.g., 1.0.0)
        payload:
          type: object
          required: [name]
          properties:
            name:
              type: string
              description: Display name of the asset in Exchange
            description:
              type: string
              description: Description of the asset
            type:
              type: string
              description: "Asset type: custom, rest-api, http-api, soap-api, raml, oas, raml-fragment"
              enum: [custom, rest-api, http-api, soap-api, raml, oas, raml-fragment]
            properties.apiVersion:
              type: string
              description: Product version (required for API types)
            properties.assetLink:
              type: string
              description: URL endpoint (required for http-api type)
            properties.mainFile:
              type: string
              description: Main file name (required when uploading spec files)
            keywords:
              type: string
              description: Comma-separated keywords for searchability
      required: [organizationId, groupId, assetId, version, payload]
    annotations:
      readOnlyHint: false
      destructiveHint: false

  - name: searchAssets
    title: Search Assets
    description: |
      Search for assets in Anypoint Exchange using the ANG search service.
      The query string is forwarded directly to the ANG search engine.
    inputSchema:
      type: object
      properties:
        q:
          type: string
          description: Search query string
        _size:
          type: integer
          description: Number of results to return
          default: 20
        x-search-id:
          type: string
          description: Search session ID for analytics
        x-search-after:
          type: string
          description: Pagination cursor
    annotations:
      readOnlyHint: true
      destructiveHint: false

  - name: pseasSearch
    title: Platform Search
    description: |
      Search assets using Platform Search. Supports semantic/hybrid search,
      filtering by type, organization, tags, categories, and custom fields.
    inputSchema:
      type: object
      properties:
        payload:
          type: object
          properties:
            search:
              type: string
              description: Free-text search term
            types:
              type: array
              items:
                type: string
              description: "Asset types to filter by (e.g. connector, rest-api)"
            status:
              type: array
              items:
                type: string
                enum: [published, deprecated, development]
              description: Lifecycle statuses to filter by
            organizationId:
              type: array
              items:
                type: string
              description: Organization IDs to filter by
            tags:
              type: array
              items:
                type: string
              description: Tag values to filter by
            categories:
              type: array
              items:
                type: string
              description: "Category filters in key:value format"
            sort:
              type: string
              enum: [relevance, name, last_modified, rating, featured]
              description: Sort order
            size:
              type: integer
              description: Number of results to return
              default: 100
            semantic:
              type: boolean
              description: Enable hybrid (BM25 + neural) search
      required: [payload]
    annotations:
      readOnlyHint: true
      destructiveHint: false

  - name: getAsset
    title: Get Asset
    description: |
      Retrieves detailed information about an asset including all its versions,
      metadata, categories, and other properties.
    inputSchema:
      type: object
      properties:
        groupId:
          type: string
          description: Group ID of the asset
        assetId:
          type: string
          description: Asset identifier
        includeSnapshots:
          type: boolean
          default: false
          description: Whether to include snapshot versions
      required: [groupId, assetId]
    annotations:
      readOnlyHint: true
      destructiveHint: false

  - name: deleteAsset
    title: Delete Asset
    description: |
      Deletes an entire asset including all its versions.
      Use soft-delete (default) to mark as deleted or hard-delete for permanent removal.
    inputSchema:
      type: object
      properties:
        groupId:
          type: string
          description: Group ID of the asset
        assetId:
          type: string
          description: Asset identifier
        X-Delete-Type:
          type: string
          default: soft-delete
          description: "Delete type: soft-delete or hard-delete"
      required: [groupId, assetId]
    annotations:
      readOnlyHint: false
      destructiveHint: true

  - name: deleteAssetVersion
    title: Delete Asset Version
    description: |
      Deletes a specific version of an asset.
      Use soft-delete to mark as deleted (recoverable) or hard-delete to permanently remove.
    inputSchema:
      type: object
      properties:
        groupId:
          type: string
          description: Group ID of the asset
        assetId:
          type: string
          description: Asset identifier
        version:
          type: string
          description: Version to delete
        X-Delete-Type:
          type: string
          default: soft-delete
          description: "Delete type: soft-delete or hard-delete"
      required: [groupId, assetId, version]
    annotations:
      readOnlyHint: false
      destructiveHint: true

  - name: getAssetReviews
    title: Get Asset Reviews
    description: Retrieves all reviews for a specific version of an asset.
    inputSchema:
      type: object
      properties:
        groupId:
          type: string
          description: Group ID of the asset
        assetId:
          type: string
          description: Asset identifier
        version:
          type: string
          description: Asset version
        includeComments:
          type: boolean
          default: false
          description: Whether to include review comments
      required: [groupId, assetId, version]
    annotations:
      readOnlyHint: true
      destructiveHint: false

  - name: updateAssetTags
    title: Update Asset Tags
    description: |
      Updates the tags for a specific version of an asset.
      Send an array of tag objects in the payload field.
    inputSchema:
      type: object
      properties:
        groupId:
          type: string
          description: Group ID of the asset
        assetId:
          type: string
          description: Asset identifier
        version:
          type: string
          description: Asset version
        payload:
          type: array
          description: Array of tag objects
          items:
            type: object
            properties:
              key:
                type: string
                description: Tag category
              value:
                type: string
                description: Tag value
      required: [groupId, assetId, version, payload]
    annotations:
      readOnlyHint: false
      destructiveHint: false

  - name: getUserProfile
    title: Get User Profile
    description: |
      Retrieves the profile information of the currently authenticated user.
      This includes user details, organization membership, and permissions.
    inputSchema:
      type: object
      properties: {}
    annotations:
      readOnlyHint: true
      destructiveHint: false
