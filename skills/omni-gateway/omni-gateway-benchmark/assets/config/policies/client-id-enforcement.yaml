apiVersion: gateway.mulesoft.com/v1alpha1
kind: PolicyBinding
metadata:
  name: api-${API_INDEX}-client-id
  namespace: flex
spec:
  targetRef:
    kind: ApiInstance
    name: api-${API_INDEX}
  policyRef:
    kind: Extension
    name: client-id-enforcement
  config:
    credentialsOriginHasHttpBasicAuthenticationHeader: false
    clientIdExpression: "#[attributes.headers['client_id']]"
    clientSecretExpression: "#[attributes.headers['client_secret']]"
---
